name: Propor melhoria
description: Sugira uma evolução de comportamento, política ou integração.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Qual necessidade concreta deve ser resolvida?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Descreva o comportamento esperado e alternativas consideradas.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibilidade
      description: Existe impacto em CLI, schemas, políticas ou fornecedores de IA?
